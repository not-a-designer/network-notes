name: Import prepared site source
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source package
        shell: python
        run: |
          import base64, hashlib, io, pathlib, zipfile
          data = base64.b64decode("")
          assert hashlib.sha256(data).hexdigest() == "98fd802e1e8d46eedf4d9cd2fb558cef8d23a3b2b5cd44494594b2131c416455"
          archive = zipfile.ZipFile(io.BytesIO(data))
          for name in archive.namelist():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and ".." not in path.parts
              assert path.parts[0] not in (".git", ".github")
          archive.extractall(".")
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Network Notes Jekyll site, templates, and validation"
          git push
