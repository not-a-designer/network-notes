<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D1117">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header shell">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
      <svg viewBox="0 0 28 28" width="28" height="28" fill="none" aria-hidden="true"><path d="M7 7h14v14H7zM7 7l14 14M7 21L21 7" stroke="currentColor" stroke-width="1.3"/><path d="M4 4h6v6H4zm14 0h6v6h-6zM4 18h6v6H4zm14 0h6v6h-6z" fill="currentColor"/></svg>
      {{ site.title | escape }}<span class="wordmark-dot">.</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/lab/' | relative_url }}" {% if page.url == '/lab/' %}aria-current="page"{% endif %}>Home Lab</a>
      <a href="{{ '/topics/' | relative_url }}" {% if page.url == '/topics/' %}aria-current="page"{% endif %}>Topics</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="main" class="shell" tabindex="-1">{{ content }}</main>
  <footer class="site-footer shell">
    <div><a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a><p>A network. A notebook. A work in progress.</p></div>
    <div class="footer-links">{% if site.social_links.github != '' %}<a href="{{ site.social_links.github | escape }}">GitHub <span aria-hidden="true">↗</span></a>{% endif %}<a href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a><span>© {{ site.time | date: '%Y' }}</span></div>
  </footer>
</body>
</html>
